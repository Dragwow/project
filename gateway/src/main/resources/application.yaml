server:
  port: 8080

spring:
  application:
    name: gateway

cloud:
  gateway:
    server:
      webflux:
        routes:
          - id: auth-service
            uri: http://auth-service:8091
            predicates:
              - Path=/api/registration/**, api/auth/**

          - id: user-service
            uri: http://user-service:8090
            predicates:
                - Path=/api/users/**
